<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b8892d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Ambika"><link rel="manifest" href="manifest.json">
<title>Ambika Jewellers</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#18202a}
.app{width:100%;max-width:430px;min-height:100vh;margin:auto;background:#f8fafc;box-shadow:0 0 30px #bbb}
.header{background:#b8892d;color:#fff;padding:14px 16px 12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.header small{display:block;font-weight:500;opacity:.9;margin-top:2px}.screen{padding:14px 14px 88px}.card{background:#fff;border:1px solid #e0e5eb;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 2px 8px #0000000a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{padding:18px 8px;border:1px solid #dfe5eb;border-radius:14px;background:#fff;text-align:center;font-weight:700}.tile b{display:block;font-size:28px;margin-bottom:7px}.label{font-size:12px;color:#66717d;margin-bottom:5px}.row{display:flex;gap:8px}.row>*{flex:1}input,select{width:100%;padding:11px;border:1px solid #cfd6de;border-radius:9px;background:#fff;font-size:15px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:14px;background:#1877d2;color:#fff}.btn.green{background:#169b62}.btn.gray{background:#e9edf2;color:#27313b}.btn.gold{background:#b8892d}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:8px 6px;border-bottom:1px solid #e7ebef;white-space:nowrap}.table th{background:#f1f4f7;text-align:left}.total{background:#e4f6e9;border-radius:10px;padding:12px;font-weight:800;display:flex;justify-content:space-between}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 4px env(safe-area-inset-bottom);z-index:6}.nav button{border:0;background:none;font-size:11px;color:#65707c}.nav button.active{color:#b07812;font-weight:800}.title{font-size:20px;font-weight:800;margin:4px 0 14px}.muted{color:#68727d;font-size:13px}.danger{color:#c62828}.success{color:#168451}.hidden{display:none}.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#1d2730;color:#fff;padding:10px 14px;border-radius:9px;font-size:13px;display:none;z-index:10}
</style>
</head>
<body>
<div class="app">
  <div class="header"><div>🪷 AMBIKA JEWELLERS<small>Billing • Stock • Ledger • Reports</small></div><div>⚙️</div></div>
  <main id="screen" class="screen"></main>
  <nav class="nav">
    <button id="nHome" onclick="home()">⌂<br>Home</button>
    <button id="nSale" onclick="sale()">＋<br>Sale</button>
    <button id="nLedger" onclick="ledger()">▤<br>Ledger</button>
    <button id="nMaster" onclick="masters()">⚙<br>Masters</button>
  </nav>
</div>
<div id="toast" class="toast"></div>
<script>
const KEY="ambika_v1_db";
let db=JSON.parse(localStorage.getItem(KEY)||'{"parties":[{"code":"A001","name":"Sample Party","balance":0}],"items":[],"sales":[],"receipts":[],"payments":[]}');
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db));toast("Data saved permanently on this device");}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1600)}
function nav(id){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));document.getElementById(id)?.classList.add("active")}
function home(){nav("nHome");let sales=db.sales.reduce((a,x)=>a+x.amount,0), rec=db.receipts.reduce((a,x)=>a+x.amount,0),pay=db.payments.reduce((a,x)=>a+x.amount,0);
document.getElementById("screen").innerHTML=`<div class="title">Dashboard</div>
<div class="card"><b>Ambika Jewellers</b><div class="muted">Financial Year 2026-27 • Data stored on this device</div></div>
<div class="grid">
<div class="tile" onclick="sale()"><b>🛒</b>Sale / Billing</div><div class="tile" onclick="masters()"><b>📦</b>Purchase / Items</div>
<div class="tile" onclick="receipt()"><b>⬇️</b>Receipt (Jama)</div><div class="tile" onclick="payment()"><b>⬆️</b>Payment (Lena)</div>
<div class="tile" onclick="ledger()"><b>👥</b>Party Ledger</div><div class="tile" onclick="masters()"><b>⚙️</b>Masters</div></div>
<div class="card"><b>Today / Current Data</b><div class="row" style="margin-top:10px"><div><div class="label">Sales</div><b>₹ ${sales.toFixed(2)}</b></div><div><div class="label">Receipt</div><b>₹ ${rec.toFixed(2)}</b></div><div><div class="label">Payment</div><b>₹ ${pay.toFixed(2)}</b></div></div></div>`}
function sale(){nav("nSale");document.getElementById("screen").innerHTML=`<div class="title">Sale (Billing)</div>
<div class="card"><div class="label">Date</div><input id="sdate" type="date" value="${new Date().toISOString().slice(0,10)}">
<div class="label" style="margin-top:10px">Party</div><select id="party">${db.parties.map(p=>`<option value="${p.code}">${p.code} — ${p.name}</option>`).join("")}</select>
<div class="label" style="margin-top:10px">Narration</div><input id="snarr" placeholder="Gold Chain Sale"></div>
<div class="card"><div class="row"><input id="item" placeholder="Item"><input id="pcs" type="number" placeholder="Pcs"></div>
<div class="row" style="margin-top:8px"><input id="gw" type="number" step="0.001" placeholder="Gr.Wt."><input id="melting" type="number" step="0.01" placeholder="Melting"></div>
<div class="row" style="margin-top:8px"><input id="wast" type="number" step="0.001" placeholder="Wastage"><input id="amt" type="number" step="0.01" placeholder="Amount"></div>
<button class="btn" style="margin-top:10px;width:100%" onclick="saveSale()">＋ Save Sale</button></div>
<div class="card"><b>Recent Sales</b><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Party</th><th>Item</th><th>Gr.Wt.</th><th>Amount</th></tr></thead><tbody>${db.sales.slice(-8).reverse().map(x=>`<tr><td>${x.date}</td><td>${x.party}</td><td>${x.item}</td><td>${x.gw.toFixed(3)}</td><td>₹${x.amount.toFixed(2)}</td></tr>`).join("")}</tbody></table></div></div>`}
function saveSale(){let x={date:document.getElementById("sdate").value,party:document.getElementById("party").value,item:document.getElementById("item").value,pcs:+document.getElementById("pcs").value||0,gw:+document.getElementById("gw").value||0,melting:+document.getElementById("melting").value||0,wast:+document.getElementById("wast").value||0,amount:+document.getElementById("amt").value||0,narr:document.getElementById("snarr").value};if(!x.item||!x.amount){toast("Item and Amount required");return}db.sales.push(x);saveDB();sale()}
function ledger(){nav("nLedger");document.getElementById("screen").innerHTML=`<div class="title">Party Ledger</div><div class="card"><select id="lparty" onchange="ledger()">${db.parties.map(p=>`<option>${p.code} — ${p.name}</option>`).join("")}</select></div>
<div class="card"><b>Transaction History</b><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Narration</th><th>Gr.Wt.</th><th>Fine Wt.</th><th>Amount</th></tr></thead><tbody>
${db.sales.map(x=>`<tr><td>${x.date}</td><td>Sale</td><td>${x.narr||x.item}</td><td>${x.gw.toFixed(3)}</td><td>—</td><td>₹${x.amount.toFixed(2)}</td></tr>`).join("")}
${db.receipts.map(x=>`<tr><td>${x.date}</td><td class="success">Receipt</td><td>${x.narr}</td><td>—</td><td>—</td><td>₹${x.amount.toFixed(2)}</td></tr>`).join("")}
${db.payments.map(x=>`<tr><td>${x.date}</td><td class="danger">Payment</td><td>${x.narr}</td><td>—</td><td>—</td><td>₹${x.amount.toFixed(2)}</td></tr>`).join("")}</tbody></table></div></div>`}
function masters(){nav("nMaster");document.getElementById("screen").innerHTML=`<div class="title">Masters</div><div class="card"><b>Account Master</b><div class="row" style="margin-top:10px"><input id="pcode" placeholder="Code"><input id="pname" placeholder="Party Name"></div><button class="btn gold" style="margin-top:10px;width:100%" onclick="addParty()">＋ Add Party</button></div>
<div class="card"><b>Parties</b>${db.parties.map(p=>`<div style="padding:10px 0;border-bottom:1px solid #eee">${p.code} — ${p.name}</div>`).join("")}</div>
<div class="card"><b>Backup</b><div class="muted" style="margin:6px 0 10px">Your data is stored locally in this browser. Export a backup before changing device.</div><button class="btn green" onclick="backup()">Export Backup</button> <button class="btn gray" onclick="restore()">Import Backup</button></div>`}
function addParty(){let c=document.getElementById("pcode").value.trim(),n=document.getElementById("pname").value.trim();if(!c||!n){toast("Code and name required");return}db.parties.push({code:c,name:n,balance:0});saveDB();masters()}
function receipt(){entry("Receipt (Jama)","receipt")}
function payment(){entry("Payment (Lena)","payment")}
function entry(title,type){document.getElementById("screen").innerHTML=`<div class="title">${title}</div><div class="card"><div class="label">Date</div><input id="edate" type="date" value="${new Date().toISOString().slice(0,10)}"><div class="label" style="margin-top:10px">Party</div><select id="eparty">${db.parties.map(p=>`<option>${p.code}</option>`).join("")}</select><div class="label" style="margin-top:10px">Narration</div><input id="enarr" placeholder="Cash / Bank"><div class="label" style="margin-top:10px">Amount</div><input id="eamt" type="number" step="0.01" placeholder="0.00"><button class="btn green" style="width:100%;margin-top:12px" onclick="saveEntry('${type}')">Save</button></div>`}
function saveEntry(type){let x={date:edate.value,party:eparty.value,narr:enarr.value,amount:+eamt.value||0};if(!x.amount){toast("Amount required");return}db[type==="receipt"?"receipts":"payments"].push(x);saveDB();home()}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Ambika_Backup.json";a.click();URL.revokeObjectURL(a.href)}
function restore(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);saveDB();home()}catch(e){toast("Invalid backup")}};r.readAsText(i.files[0])};i.click()}
home();
</script>
</body></html>
